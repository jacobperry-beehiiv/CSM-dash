name: deliverability-data-sync

# Re-pulls ONLY the deliverability snapshot from ClickHouse (the
# joined Q1-Q4 result + spam dates) and commits
# data/deliverability.enc.json back to the repo. Vercel's GitHub
# integration sees the new commit and auto-redeploys.
#
# Trigger:
#   • manually via "Run workflow" on this page
#   • via the dashboard "Refresh data" button on /csm?tab=deliverability
#     (POST /api/sync/deliverability → GitHub workflow_dispatch API)
#
# This is the lightweight sibling of sync-data.yml — that workflow
# pulls Metabase + HubSpot + ClickHouse and takes 3–5 min. This one
# skips everything except the ~30s ClickHouse fetch.
#
# Required repo secrets (already set for the full sync):
#   • SNAPSHOT_ENCRYPTION_KEY  — 32-byte base64; same one set in Vercel env
#   • METABASE_API_KEY         — Metabase session token; the deliverability
#                                engine talks to ClickHouse THROUGH Metabase's
#                                native-query proxy, so without this every
#                                per-day fetchPosts call fails with
#                                "Missing credentials" and the snapshot ships
#                                with 0 posts (workflow still reports success
#                                because the engine's safe() wrapper swallows
#                                per-day errors).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Coordinate with sync-data.yml so we never push at the same time.
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify required secrets are set
        env:
          SNAPSHOT_ENCRYPTION_KEY: ${{ secrets.SNAPSHOT_ENCRYPTION_KEY }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: |
          missing=()
          for v in SNAPSHOT_ENCRYPTION_KEY METABASE_API_KEY; do
            if [ -z "${!v}" ]; then
              missing+=("$v")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required repo secret(s): ${missing[*]}"
            exit 1
          fi
          echo "All required secrets present."

      - name: Sync + encrypt deliverability snapshot
        # `tee` so the "(N posts, ...)" summary line stays visible in
        # the workflow output AND we can grep it below to fail hard
        # when the engine's per-day queries all soft-failed (which
        # happens silently when Metabase creds are missing — the very
        # bug this file guards against).
        #
        # Pattern is a FIXED string "(0 posts, " with the leading
        # paren + trailing comma. Naive `grep -q "0 posts"` matches
        # "30000 posts" too — every N-ending-in-0 count trips the
        # guard as a false positive, blocking real syncs from
        # committing (30k-post sync on 2026-08-06 was aborted this
        # way). Anchoring to "(0 posts, " matches only the true
        # empty case that sync.ts emits: "[sync] wrote … (0 posts,
        # spam dates: none, 0.0s)".
        run: |
          npm run sync -- --only=deliverability 2>&1 | tee /tmp/sync-out.log
          if grep -qF "(0 posts, " /tmp/sync-out.log; then
            echo "::error::Deliverability sync wrote an empty snapshot (0 posts). Check the Metabase credentials + fetchPosts logs above — the engine's safe() wrapper swallows per-day errors so the outer sync succeeded despite every query failing."
            exit 1
          fi
        env:
          SNAPSHOT_ENCRYPTION_KEY: ${{ secrets.SNAPSHOT_ENCRYPTION_KEY }}
          METABASE_URL: https://beehiiv.metabaseapp.com
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}

      - name: Commit + push deliverability snapshot
        run: |
          git config user.name  "csm-dash-bot"
          git config user.email "csm-dash-bot@users.noreply.github.com"
          if [ ! -f data/deliverability.enc.json ]; then
            echo "::warning::Deliverability snapshot missing — engine may have soft-failed. Skipping commit."
            exit 0
          fi
          git add data/deliverability.enc.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore(data): refresh deliverability snapshot ($(date -u +%FT%TZ))"

          # Same retry-on-non-fast-forward pattern as sync-data.yml — a
          # concurrent push to main during the ~60s run window would
          # otherwise reject our push.
          push_attempt=0
          max_attempts=5
          until git push; do
            push_attempt=$((push_attempt + 1))
            if [ "$push_attempt" -ge "$max_attempts" ]; then
              echo "::error::Push rejected after $max_attempts retries — giving up."
              exit 1
            fi
            echo "Push rejected (attempt $push_attempt/$max_attempts) — rebasing and retrying…"
            sleep $((RANDOM % 5 + 2))
            git fetch origin main
            git rebase --strategy-option=theirs origin/main
          done
