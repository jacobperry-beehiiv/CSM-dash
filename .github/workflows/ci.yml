name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Guards against the 307-to-/login class: a cron endpoint that
      # isn't proxy-exempt fails silently in Actions for weeks.
      - run: npm run check:cron
      - run: npm run build
        env:
          DATA_SOURCE: snapshot
