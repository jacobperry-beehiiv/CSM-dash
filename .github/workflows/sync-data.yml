name: sync-data

# Pulls the latest book of business from Metabase, encrypts it with
# SNAPSHOT_ENCRYPTION_KEY, and commits data/snapshot.enc.json back to the
# repo. Vercel's GitHub integration sees the new commit and auto-redeploys
# with the fresh data.
#
# Trigger:
#   • automatically twice daily (08:00 and 16:00 UTC, every day of the week)
#   • manually via the "Run workflow" button on this workflow's page
#
# Weekends matter: Enterprise customers send on Saturday and Sunday
# too, and the Deliverability tab reads exclusively from the committed
# snapshot. A weekday-only cadence made weekend sends invisible until
# Monday morning, which masked real low-deliverability incidents.
#
# Required repo secrets:
#   • METABASE_API_KEY
#   • SNAPSHOT_ENCRYPTION_KEY  (32-byte base64; same one set in Vercel env)
#   • HUBSPOT_ACCESS_TOKEN     (Private App `pat-na1-…`. Without this the
#                              sync soft-fails enrichment — every row's
#                              `last_activity_at` and `hubspot_contacts`
#                              would land empty in the committed snapshot.)

on:
  workflow_dispatch:
  schedule:
    # Twice daily, every day of the week — morning + early afternoon
    # ET-ish. Weekend coverage is intentional; see header comment.
    - cron: "0 8,16 * * *"

permissions:
  # We need write access to push the encrypted snapshot back to the repo.
  contents: write

concurrency:
  # Don't let two scheduled runs (or a manual + a scheduled) race each
  # other and produce a merge conflict on snapshot.enc.json.
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need a token that can push back, not the default read-only one.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Hard-fail the workflow if any required secret is missing. Without
      # this guard a missing HUBSPOT_ACCESS_TOKEN silently degrades the
      # sync to "skip enrichment" mode and overwrites the previously
      # enriched snapshot with one missing last_activity_at +
      # hubspot_contacts — which is exactly what happened twice before
      # we noticed.
      - name: Verify required secrets are set
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SNAPSHOT_ENCRYPTION_KEY: ${{ secrets.SNAPSHOT_ENCRYPTION_KEY }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: |
          missing=()
          for v in METABASE_API_KEY SNAPSHOT_ENCRYPTION_KEY HUBSPOT_ACCESS_TOKEN; do
            if [ -z "${!v}" ]; then
              missing+=("$v")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required repo secret(s): ${missing[*]}. Add them under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "All required secrets present."

      - name: Sync + encrypt snapshot
        run: npm run sync
        env:
          METABASE_URL: https://beehiiv.metabaseapp.com
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SNAPSHOT_ENCRYPTION_KEY: ${{ secrets.SNAPSHOT_ENCRYPTION_KEY }}
          # HubSpot Private-App token. Drives the per-row enrichment of
          # `last_activity_at` + `hubspot_contacts`. If this secret is
          # missing the sync prints "HubSpot auth not configured —
          # skipping HubSpot enrichment" and writes a snapshot without
          # those fields, overwriting whatever the previous run produced.
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}

      - name: Commit + push encrypted snapshots
        run: |
          # Stage every snapshot file that exists. Cohort syncs are
          # soft-fail in sync.ts, so any one of these may be missing on
          # a given run — skip rather than error.
          git config user.name  "csm-dash-bot"
          git config user.email "csm-dash-bot@users.noreply.github.com"
          for f in \
            data/snapshot.enc.json \
            data/approaching-enterprise.enc.json \
            data/past-due.enc.json \
            data/deliverability.enc.json
          do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --staged --quiet; then
            echo "All snapshots unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore(data): refresh encrypted snapshots ($(date -u +%FT%TZ))"

          # The sync run takes a few minutes — if a human (or another
          # workflow) pushed to main during that window, our local main
          # is stale and `git push` will be rejected as non-fast-forward.
          # Retry up to N times with a rebase pulling in remote work
          # first. Snapshots are pure-content commits and don't conflict
          # with code changes, so the rebase should always apply cleanly.
          push_attempt=0
          max_attempts=5
          until git push; do
            push_attempt=$((push_attempt + 1))
            if [ "$push_attempt" -ge "$max_attempts" ]; then
              echo "::error::Push rejected after $max_attempts retries — giving up. Inspect the branch state and re-run."
              exit 1
            fi
            echo "Push rejected (attempt $push_attempt/$max_attempts) — fetching + rebasing main on top of remote and retrying…"
            # Small jitter so two concurrent workflows don't lockstep.
            sleep $((RANDOM % 5 + 2))
            git fetch origin main
            # Rebase our snapshot commit on top of whatever landed
            # remotely. -X theirs keeps remote's view of any code files
            # that happen to overlap; snapshot files only change here so
            # that's effectively a no-op for our use.
            git rebase --strategy-option=theirs origin/main
          done
