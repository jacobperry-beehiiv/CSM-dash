name: deliverability-sweep

# Posts Slack pings for newly-seen critical Enterprise deliverability
# posts. Respects notification prefs at /settings/slack →
# "Critical deliverability".
#
# Required repo secrets:
#   • CRON_SECRET    — bearer; same value as the Vercel env var
#   • DASHBOARD_URL  — root URL, no trailing slash
#
# Triggers:
#   • weekdays at 09:15 UTC (after the 08:00 sync-data run)
#   • manually via "Run workflow"

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * 1-5"

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are set
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          missing=()
          for v in CRON_SECRET DASHBOARD_URL VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!v}" ]; then
              missing+=("$v")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required repo secret(s): ${missing[*]}"
            exit 1
          fi
          echo "All required secrets present."

      - name: POST /api/deliverability/sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -e
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            -H "Content-Type: application/json" \
            "${DASHBOARD_URL}/api/deliverability/sweep")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Deliverability sweep failed with HTTP $code"
            exit 1
          fi
          if echo "$body" | grep -q '"disabled":true'; then
            echo "::warning::Sweep skipped — enable Critical deliverability at /settings/slack and set a destination."
          fi
